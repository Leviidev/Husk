name: HUNG APK PLAYER iOS

on:
  push:
    branches: [hung-apk-player]
  workflow_dispatch:
    inputs:
      dependency_mode:
        description: Reuse pinned upstream dependencies, or rebuild every dependency
        type: choice
        options: [upstream, source]
        default: upstream

permissions:
  contents: read

env:
  R8_URL: https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.9.35/r8-8.9.35.jar
  R8_SHA256: 204b2fc2b0f4e888dc0ef748b58090def1bf4185068d36abbb94841dbc7107a8

jobs:
  portable-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portable QA and real host iconv
        run: python3 tests/run_portable.py --sanitize
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.os }}-${{ github.sha }}
          path: build/qa-results.json
          if-no-files-found: ignore

  java-framework:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java framework and test dialog lifecycle
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 "$R8_URL" --output "$RUNNER_TEMP/r8.jar"
          echo "$R8_SHA256  $RUNNER_TEMP/r8.jar" | sha256sum --check
          python3 scripts/build_hung_framework.py --jdk "$JAVA_HOME" --r8 "$RUNNER_TEMP/r8.jar" --output build/hung-java/runtime
          python3 tests/run_java_framework.py --jdk "$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: java-framework-${{ github.sha }}
          path: build/hung-java/runtime
          if-no-files-found: error

  ios:
    needs: [portable-qa, java-framework]
    # StikJIT's checked-in Swift 6.4 interface uses module selectors (::).
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      DD: ${{ github.workspace }}/build/DerivedData
      HUSK_PROJECT_SPEC: project.hung.generated.yml
      HUSK_INCLUDE_PS4: '0'
      HUSK_REQUIRE_ANDROID_RUNTIME: '1'
      HUNG_DEPENDENCY_MODE: ${{ inputs.dependency_mode || 'upstream' }}
      SUPPORT_IPA_URL: https://github.com/Leviidev/Husk/releases/download/3.3/Husk.ipa
      SUPPORT_IPA_SHA256: 47cdbac8ba310886bdd74d148ea411298e5cf0dd7bedc7f93d6da810681f695f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun swiftc --version | tee "$RUNNER_TEMP/swift-version.txt"
          python3 -c 'import pathlib,re,sys; m=re.search(r"Swift version (\d+)\.(\d+)", pathlib.Path(sys.argv[1]).read_text()); assert m and tuple(map(int,m.groups())) >= (6,4), "StikJIT requires Swift 6.4 module selectors"' "$RUNNER_TEMP/swift-version.txt"
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          python3 -c 'import sys; assert int(sys.argv[1].split(".")[0]) >= 26, "HuskJITHelper needs iOS SDK 26 or later"' "$SDK_VERSION"
      - name: Install build tools
        run: |
          brew install xcodegen qemu
          if [ "$HUNG_DEPENDENCY_MODE" = source ]; then
            brew install meson ninja pkg-config cmake ccache automake autoconf libtool
          fi
          rustup target add aarch64-apple-ios
          find scripts -name '*.sh' -exec chmod +x {} +
      - name: Bootstrap pinned Android resources
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 "$SUPPORT_IPA_URL" --output "$RUNNER_TEMP/husk-support.ipa"
          python3 scripts/prepare_hung_ci.py "$RUNNER_TEMP/husk-support.ipa" "$SUPPORT_IPA_SHA256"
      - name: Download this revision's tested Java framework
        uses: actions/download-artifact@v4
        with:
          name: java-framework-${{ github.sha }}
          path: build/java-framework-built
      - name: Stage the rebuilt Java framework
        run: |
          python3 scripts/stage_hung_framework.py build/java-framework-built
      - name: Check iconv and memory-query bridges against the iOS SDK
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.5 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=gnu11 -Wall -Wextra -Werror -fsyntax-only src/translation-layer-next/husk-tl-bionic-iconv.c
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.5 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=gnu11 -I src/translation-layer -I src/translation-layer-next -I src/ios-jit -fsyntax-only src/translation-layer-next/husk-tl-bionic-io.c
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.5 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=gnu11 -Wall -Wextra -Werror -I src/translation-layer -I src/translation-layer-next -fsyntax-only src/translation-layer-next/husk-tl-vhtg-quest.c
      - name: Build the modified app with the upstream packager
        run: |
          if [ "$HUNG_DEPENDENCY_MODE" = source ]; then
            bash scripts/ci_build.sh "$GITHUB_WORKSPACE/build/HUNG-APK-PLAYER.ipa"
          else
            python3 scripts/stage_hung_dependencies.py "$RUNNER_TEMP/husk-support.ipa" "$SUPPORT_IPA_SHA256"
            bash scripts/build_rppairing_ios.sh
            bash scripts/package_ipa.sh "$GITHUB_WORKSPACE/build/HUNG-APK-PLAYER.ipa"
          fi
      - name: Package this revision's source and provenance
        run: |
          git archive --format=zip --output=build/HUNG-APK-PLAYER-source.zip HEAD
          shasum -a 256 build/HUNG-APK-PLAYER.ipa > build/HUNG-APK-PLAYER.ipa.sha256
      - name: Upload IPA and corresponding project source
        uses: actions/upload-artifact@v4
        with:
          name: HUNG-APK-PLAYER-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/HUNG-APK-PLAYER.ipa
            build/HUNG-APK-PLAYER.ipa.sha256
            build/HUNG-APK-PLAYER-source.zip
            build/support-provenance.json
            build/java-framework-built/java-framework-build.json
            LICENSE
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            build/logs
            build/DerivedData/build.log
            build/support-provenance.json
