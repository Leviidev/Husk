name: Build test IPA

on:
  workflow_dispatch:
  push:
    branches: [fix/viper-sensor-api]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Host tools
        run: |
          brew install python meson ninja pkg-config xcodegen qemu e2fsprogs bison flex gettext
          BREW_PREFIX="$(brew --prefix)"
          "$BREW_PREFIX/bin/python3" -m pip install --break-system-packages --user pyyaml mako packaging
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "DEBUGFS=$(brew --prefix e2fsprogs)/sbin/debugfs" >> "$GITHUB_ENV"
          ls "$BREW_PREFIX/bin/meson" "$BREW_PREFIX/bin/ninja"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install D8
        run: |
          mkdir -p build/tools
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar \
            -o build/tools/r8.jar
          jar tf build/tools/r8.jar | grep -q '^com/android/tools/r8/D8.class$'
          echo "HUSK_JDK=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "HUSK_D8=$GITHUB_WORKSPACE/build/tools/r8.jar" >> "$GITHUB_ENV"

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/sources
            third_party/gpu
            build/ios-arm64/sysroot
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/sources.sh', 'scripts/build_ios.sh', 'scripts/build_angle_ios.sh', 'scripts/build_gpu_ios.sh', 'patches/libslirp-v4.9.1.patch', 'patches/pixman-0.38.0.patch', 'patches/husk-epoxy-ios-egl-path.patch') }}

      - name: Cache Lineage system image
        uses: actions/cache@v4
        with:
          path: build/android-guest/vda-*.qcow2
          key: lineage-${{ runner.os }}-${{ hashFiles('src/app/Husk/GuestImage.swift') }}
          restore-keys: lineage-${{ runner.os }}-

      - name: Stage the verified PS4 runtime module
        run: |
          set -euo pipefail
          upstream_ipa="$RUNNER_TEMP/Husk-upstream-3.0.ipa"
          release_sha256=112a1ddbb3143ae25e80c18c5b195b6dfa5067d66cbf99d2188fc03f4ab0f61d
          ps4_sha256=dfdf728bfba56ac045d177d4be398df0c73361c299a114fd34a4ba96e2a0699e
          curl -fL --retry 3 --retry-delay 5 \
            https://github.com/Leviidev/Husk/releases/download/3.0/Husk.ipa \
            -o "$upstream_ipa"
          printf '%s  %s\n' "$release_sha256" "$upstream_ipa" | shasum -a 256 -c -
          mkdir -p build/ios-arm64/lib
          ps4="$PWD/build/ios-arm64/lib/libhuskps4.dylib"
          unzip -p "$upstream_ipa" Payload/Husk.app/Frameworks/libhuskps4.dylib > "$ps4"
          actual_ps4_sha256="$(shasum -a 256 "$ps4" | awk '{print $1}')"
          test "$actual_ps4_sha256" = "$ps4_sha256"
          test "$(lipo -archs "$ps4")" = arm64
          test "$(nm -gU "$ps4" | awk '{print $3}')" = _husk_console_module_v1
          if nm -u "$ps4" | grep -q BreakGetJITMapping; then
            echo "PS4 module still references BreakpointJIT" >&2
            exit 1
          fi
          echo "Verified and staged the official Husk 3.0 PS4 module"

      - name: Build Husk IPA
        run: ./scripts/ci_build.sh "$PWD/build/Husk.ipa"

      - name: Verify complete IPA payload
        run: |
          set -euo pipefail
          ipa="$PWD/build/Husk.ipa"
          ps4_path=Payload/Husk.app/Frameworks/libhuskps4.dylib
          unzip -Z1 "$ipa" | grep -Fx "$ps4_path"
          packaged_ps4_sha256="$(unzip -p "$ipa" "$ps4_path" | shasum -a 256 | awk '{print $1}')"
          test "$packaged_ps4_sha256" = dfdf728bfba56ac045d177d4be398df0c73361c299a114fd34a4ba96e2a0699e
          echo "Complete IPA size: $(stat -f '%z' "$ipa") bytes"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-test-IPA
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish test IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="test-ipa-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" build/Husk.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Husk test IPA #${GITHUB_RUN_NUMBER}" \
            --notes "Automated test build for the ViperGames Stickman Dismounting compatibility fix." \
            --prerelease
