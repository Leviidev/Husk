name: Build test IPA

on:
  workflow_dispatch:
  push:
    branches: [fix/viper-sensor-api]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build Husk IPA
        run: ./scripts/ci_build.sh build/Husk.ipa
      - name: Show build logs on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          logs = sorted(Path("build/logs").glob("*.log"), key=lambda p: p.stat().st_mtime, reverse=True)
          for path in logs[:3]:
              print(f"\n--- {path} (last 120 lines) ---")
              lines = path.read_text(errors="replace").splitlines()
              print("\n".join(lines[-120:]))
          PY
      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-test-IPA
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 14
